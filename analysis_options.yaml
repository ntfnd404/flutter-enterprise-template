include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    dead_code: error

formatter:
  page_width: 80
  trailing_commas: preserve

linter:
  rules:
    # Type safety and public API clarity
    always_declare_return_types: true
    avoid_dynamic_calls: error
    only_throw_errors: true
    test_types_in_equals: true
    type_annotate_public_apis: true

    # Async and resource safety
    cancel_subscriptions: true
    close_sinks: true
    unawaited_futures: true
    unnecessary_async: true

    # Correctness and defensive control flow
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    unnecessary_null_in_if_null_operators: warning
    unnecessary_statements: true
    unnecessary_this: warning

    # Imports, packages, and library boundaries
    directives_ordering: true
    library_names: true
    simple_directive_paths: true

    # Maintainability
    always_put_required_named_parameters_first: true
    avoid_positional_boolean_parameters: true
    avoid_redundant_argument_values: true
    prefer_final_fields: warning
    prefer_final_in_for_each: warning
    prefer_final_locals: true
    # Public constructor parameters intentionally keep names without a private
    # underscore even when they initialize private implementation fields.
    prefer_initializing_formals: false

    # Modern Dart idioms
    prefer_const_constructors: warning
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: warning
    prefer_if_elements_to_conditional_expressions: warning
    prefer_interpolation_to_compose_strings: warning
    prefer_typing_uninitialized_variables: warning
    prefer_void_to_null: true
    use_named_constants: true
    use_super_parameters: warning

    # Formatting and readability
    prefer_single_quotes: true
    require_trailing_commas: true
    sort_constructors_first: true
    sort_unnamed_constructors_first: true

    # Flutter-specific safety and readability
    # These rules intentionally remain explicit even though flutter_lints
    # currently enables them: they are non-negotiable scaffold policies.
    avoid_web_libraries_in_flutter: true
    flutter_style_todos: true
    use_colored_box: true
    use_decorated_box: true
    use_build_context_synchronously: true
